name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always ship the latest data, including commits made earlier in the calling run
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/test/*.test.mjs
      - run: mkdir -p _site && cp -r index.html roster.html build.html leaderboard.html player.html card.html assets data _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
