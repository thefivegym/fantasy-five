name: Weekly lineup reminder
on:
  schedule:
    # Wednesday 10:00 AM America/Chicago. CST (Nov to mid-Mar) = 16:00 UTC; CDT (mid-Mar on) = 15:00 UTC.
    # Both run; the script only posts on the one that is 10 AM in Chicago.
    - cron: '0 16 * * 3'
    - cron: '0 15 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the reminder, mention nobody, open nothing'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency: { group: reminder, cancel-in-progress: false }
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Remind
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DRY" = "true" ]; then node scripts/remind.mjs --dry-run
          elif [ "$MANUAL" = "true" ]; then node scripts/remind.mjs --force
          else node scripts/remind.mjs; fi
