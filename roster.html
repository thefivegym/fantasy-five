<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster — Fantasy Five</title>
<meta name="description" content="Fantasy Five: pick five gymnasts per event, every week of the NCAA D1 women's gymnastics season. By The Five That Score. Just the read.">
<meta property="og:title" content="Roster — Fantasy Five">
<meta property="og:description" content="Pick five per event. Twenty slots. No drops. Just the read.">
<meta name="twitter:site" content="@thefivethatscore">
<meta name="theme-color" content="#14112b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314112b'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23ffcf4a'%3E5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
</head>
<body>
<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <h2>Roster</h2>
  <p class="sub">2026–27 D1 rosters. Numbers are 2026 Road to Nationals event averages and NQS (final regular-season RQS). They guide the draft; they don't score anything. <span class="pill new">NEW</span> = no 2026 NCAA scores on that event or at all.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search name or team" aria-label="Search">
    <select id="team" aria-label="Team"><option value="">All teams</option></select>
    <select id="ev" aria-label="Event"><option value="">All events</option><option value="vault">Vault</option><option value="bars">Bars</option><option value="beam">Beam</option><option value="floor">Floor</option></select>
    <select id="sort" aria-label="Sort">
      <option value="proj">Sort: projection (NQS, else avg)</option>
      <option value="avg">Sort: 2026 average</option>
      <option value="name">Sort: name</option>
      <option value="team">Sort: team</option>
    </select>
    <label class="sub" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="hasproj"> with 2026 numbers only</label>
  </div>
  <div class="count" id="count"></div>
  <div class="card tscroll" style="padding:0">
    <table class="t" id="tbl"><thead></thead><tbody></tbody></table>
  </div>
  <p class="sub" id="cov"></p>
</main>
<script>
FF.chrome('roster.html');
(async () => {
  const G = await FF.gymnasts();
  const teams = (await FF.json('data/teams.json')).teams;
  const sel = document.getElementById('team');
  teams.filter(t => t.roster_count).forEach(t => sel.insertAdjacentHTML('beforeend', `<option value="${FF.esc(t.id)}">${FF.esc(t.name)}</option>`));
  const $ = id => document.getElementById(id);
  for (const k of ['team', 'ev', 'sort']) if (FF.q.get(k)) $(k).value = FF.q.get(k);
  if (FF.q.get('q')) $('q').value = FF.q.get('q');
  const c = G.coverage;
  $('cov').textContent = `Coverage: ${c.teams_with_roster} of ${c.teams_total} D1 teams, ${G.gymnasts.length} gymnasts, ${c.with_projection} with a 2026 projection on at least one event. Sources in the repo README.`;
  const val = (g, ev, kind) => {
    const evs = ev ? [ev] : FF.EVENTS;
    const xs = evs.map(e => kind === 'avg' ? g.proj?.[e]?.avg : FF.proj(g, e)).filter(x => x != null);
    if (!xs.length) return null;
    return ev ? xs[0] : Math.max(...xs);
  };
  function render() {
    const q = $('q').value.trim().toLowerCase(), team = $('team').value, ev = $('ev').value, sort = $('sort').value, hp = $('hasproj').checked;
    let rows = G.gymnasts.filter(g => (!team || g.team_id === team) && (!q || (g.name + ' ' + g.team).toLowerCase().includes(q)));
    if (hp) rows = rows.filter(g => val(g, ev, 'proj') != null);
    if (sort === 'name') rows.sort((a, b) => a.name.localeCompare(b.name));
    else if (sort === 'team') rows.sort((a, b) => a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
    else rows.sort((a, b) => (val(b, ev, sort) ?? -1) - (val(a, ev, sort) ?? -1) || a.name.localeCompare(b.name));
    $('count').textContent = `${rows.length} gymnasts`;
    const evs = ev ? [ev] : FF.EVENTS;
    document.querySelector('#tbl thead').innerHTML = `<tr><th>Gymnast</th><th>Team</th><th>Yr</th>${evs.map(e => ev ? `<th class="n">${FF.EV_SHORT[e]} avg</th><th class="n">NQS</th><th class="n">High</th>` : `<th class="n" title="2026 NQS, else average">${FF.EV_SHORT[e]}</th>`).join('')}</tr>`;
    const cell = (g, e) => {
      const p = g.proj?.[e];
      if (ev) return p ? `<td class="n">${FF.f3(p.avg)}</td><td class="n">${FF.f3(p.nqs)}</td><td class="n">${FF.f3(p.high)}</td>` : `<td class="n" colspan="3"><span class="pill new">NEW</span></td>`;
      return `<td class="n">${p ? FF.f3(p.nqs ?? p.avg) : '<span class="sub">—</span>'}</td>`;
    };
    document.querySelector('#tbl tbody').innerHTML = rows.slice(0, 600).map(g => `<tr><td><b>${FF.esc(g.name)}</b>${g.projection_status === 'none' ? ' <span class="pill new">NEW</span>' : ''}${g.prev_team && g.prev_team !== g.team ? `<div class="sub">2026: ${FF.esc(g.prev_team)}</div>` : ''}</td><td>${FF.esc(g.team)}</td><td>${FF.esc(g.class_year || '')}</td>${evs.map(e => cell(g, e)).join('')}</tr>`).join('')
      + (rows.length > 600 ? `<tr><td colspan="9" class="sub">Showing 600 of ${rows.length}. Narrow the search.</td></tr>` : '');
  }
  ['q', 'team', 'ev', 'sort', 'hasproj'].forEach(id => $(id).addEventListener('input', render));
  render();
})().catch(e => { const b = document.getElementById('banner'); b.hidden = false; b.className = 'banner err'; b.textContent = 'Could not load data: ' + e.message; });
</script>
</body>
</html>
